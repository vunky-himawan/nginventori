name: CI Simulation

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Application
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DB_URL: ${{ secrets.DB_URL }}
        run: pnpm build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/
            public/
            package.json
            next.config.js

      - name: Notify on Success
        if: ${{ success() }}
        run: |
          MESSAGE=""
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            MESSAGE="✅ Success on branch '${{ github.head_ref }}' with commit message '${{ github.event.pull_request.title }}' when pull request '${{ github.event.pull_request.number }}' in destination branch '${{ github.base_ref }}'. You can merge right now!"
          elif [ "${{ github.event_name }}" == "push" ]; then
            MESSAGE="✅ Success on branch '${{ github.ref_name }}' with commit message '${{ github.event.head_commit.message }}' in destination branch '${{ github.ref_name }}'."
          fi

          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify on Failure
        if: ${{ failure() }}
        run: |
          MESSAGE=""
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            MESSAGE="❌ Build failed on branch '${{ github.head_ref }}' with pull request '${{ github.event.pull_request.number }}' targeting branch '${{ github.base_ref }}'. Please review the logs and fix the issue."
          elif [ "${{ github.event_name }}" == "push" ]; then
            MESSAGE="❌ Build failed on branch '${{ github.ref_name }}'. Please review the logs and fix the issue."
          fi

          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify_review:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify Code Review
        run: |
          REVIEWER="${{ github.event.review.user.login }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          if [[ -z "$REVIEWER" ]]; then
            MESSAGE="📝 A code review has been submitted for PR #${PR_NUMBER}. However, the reviewer is not specified."
          elif [[ -z "$PR_BODY" ]]; then
            MESSAGE="📝 Code review submitted by '${REVIEWER}' on PR #${PR_NUMBER} (${PR_TITLE}). No description provided."
          else
            MESSAGE="📝 Code review submitted by '${REVIEWER}' on PR #${PR_NUMBER}. \nTitle: '${PR_TITLE}' \nDescription: '${PR_BODY}' \nReview State: '${REVIEW_STATE}' \nPR Link: ${PR_URL}"
          fi

          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}

  code-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run Formatter
        run: pnpm format

      - name: Run Linter
        run: pnpm lint

      - name: Check if __tests__ are not empty
        id: check_folders
        run: |
          if [ -z "$(find . -type d -name "__tests__")" ]; then
            echo "No test directories found."
            echo "run_tests=false" >> $GITHUB_ENV
          else
            echo "Test directories found, running tests."
            echo "run_tests=true" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        if: env.run_tests == 'true'
        run: pnpm test

  opensource-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  release:
    if: ${{ github.event_name == 'push' }}
    needs:
      - opensource-security
      - code-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Deploy
        run: echo "Deploying to production"

      - name: Notify on Success
        if: ${{ success() }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"✅ Deployment success on branch '${{ github.ref_name }}' with commit message '${{ github.event.head_commit.message }}'.\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}  

      - name: Notify on Failure
        if: ${{ failure() }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"❌ Deployment failed on branch '${{ github.ref_name }}'. Please check the logs for details.\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}

  opensource-monitor:
    if: ${{ github.event_name == 'push' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Monitor Open Source
        run: echo "Monitoring open source usage"
